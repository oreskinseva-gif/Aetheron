name: Build Aetheron

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: aetheron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract sources
        run: |
          cat source_parts/* > Aetheron-src.tar.gz
          mkdir -p src-project
          tar xzf Aetheron-src.tar.gz -C src-project

      - name: Build with Gradle
        working-directory: src-project/aetheron
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Aetheron-1.0.0
          path: src-project/aetheron/build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
