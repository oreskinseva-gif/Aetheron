name: Build Aetheron + Xumiqa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: aetheron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract sources
        run: |
          mkdir -p src-project
          cat source_parts/* > Aetheron-src.tar.gz
          tar xzf Aetheron-src.tar.gz -C src-project

      - name: Build Aetheron
        working-directory: src-project/Aetheron/aetheron
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Build Xumiqa
        working-directory: src-project/Xumiqa/xumiqa
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect jars
        run: |
          mkdir -p out
          cp src-project/Aetheron/aetheron/build/libs/aetheron-1.0.0.jar out/Aetheron.jar
          cp src-project/Xumiqa/xumiqa/build/libs/xumiqa-4.3.1-rebuilt.jar out/Xumiqa.jar

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Clients
          path: out/*.jar
          if-no-files-found: error
          retention-days: 90
